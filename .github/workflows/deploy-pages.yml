name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build SPA
        run: npm run build:spa

      - name: SPA fallback + CNAME
        run: |
          cp dist/index.html dist/404.html
          # Keep custom domain across orphan deploys
          echo "kaleidoscope.webbspinnervisions.net" > dist/CNAME
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          # Explicit custom domain (also written via CNAME file above)
          cname: kaleidoscope.webbspinnervisions.net
